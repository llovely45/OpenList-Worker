name: Build, deploy, and repair 115 Open

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-openlist-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENLIST_BASE_URL: ${{ vars.OPENLIST_BASE_URL || 'https://alist.nmsl.best' }}
      OPENLIST_ADMIN_TOKEN: ${{ secrets.OPENLIST_ADMIN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        shell: bash
        run: |
          mapfile -t tests < <(find src/backend -name '*.test.ts' -print | sort)
          ./node_modules/.bin/tsx --test "${tests[@]}"

      - name: Build frontend and Worker bundles
        run: pnpm run build

      - name: Package repair plugin
        shell: bash
        run: |
          mkdir -p artifacts
          (
            cd plugins/115-open-driver-repair
            zip -q -r "$GITHUB_WORKSPACE/artifacts/oplist-plugin-115-open-driver-repair.zip" \
              plugin.json index.js README.md icon.svg
          )

      - name: Upload repair plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: oplist-plugin-115-open-driver-repair
          path: artifacts/oplist-plugin-115-open-driver-repair.zip
          if-no-files-found: error

      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN is not configured" >&2
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2
            exit 1
          }
          test -n "$OPENLIST_ADMIN_TOKEN" || {
            echo "OPENLIST_ADMIN_TOKEN is not configured" >&2
            exit 1
          }

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --yes

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          base_url="${OPENLIST_BASE_URL%/}"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 --connect-timeout 10 --max-time 60 \
            "$base_url/api/health"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 --connect-timeout 10 --max-time 60 \
            "$base_url/api/healthz"

      - name: Install plugin and repair existing 115 Open storages
        shell: bash
        run: |
          set -euo pipefail
          base_url="${OPENLIST_BASE_URL%/}"

          plugin_payload="$(node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const root = path.join(process.cwd(), "plugins", "115-open-driver-repair")
          const manifest = JSON.parse(fs.readFileSync(path.join(root, "plugin.json"), "utf8"))
          manifest.script_content = fs.readFileSync(path.join(root, "index.js"), "utf8")
          process.stdout.write(JSON.stringify(manifest))
          NODE
          )"

          install_response="$(curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $OPENLIST_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$base_url/api/admin/plugin/install" \
            --data "$plugin_payload")"
          node -e '
            const response = JSON.parse(process.argv[1]);
            if (response.code !== 200) {
              throw new Error(response.message || "plugin installation failed");
            }
            console.log("repair plugin installed or updated");
          ' "$install_response"

          repair_response="$(curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $OPENLIST_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$base_url/api/admin/driver/115open/repair" \
            --data '{}')"
          repaired_count="$(node -e '
            const response = JSON.parse(process.argv[1]);
            if (response.code !== 200) {
              throw new Error(response.message || "115 repair failed");
            }
            const data = response.data || {};
            process.stderr.write(`115 repair complete: matched=${data.matched || 0}, repaired=${data.repaired || 0}, skipped=${data.skipped || 0}\n`);
            process.stdout.write(String(data.repaired || 0));
          ' "$repair_response")"

          if [ "$repaired_count" -gt 0 ]; then
            list_response="$(curl --fail --silent --show-error --location \
              --retry 3 --connect-timeout 10 --max-time 60 \
              -H "Authorization: Bearer $OPENLIST_ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST "$base_url/api/fs/list" \
              --data '{"path":"/115","page":1,"per_page":1}')"
            node -e '
              const response = JSON.parse(process.argv[1]);
              if (response.code !== 200) {
                throw new Error(response.message || "115 list verification failed");
              }
              console.log("115 /api/fs/list verification passed");
            ' "$list_response"
          else
            echo "No enabled 115 Open storage was repaired; list verification skipped."
          fi
