name: Sync upstream OpenList updates

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream main
        env:
          UPSTREAM_REPOSITORY: https://github.com/OpenListTeam/OpenList-Worker.git
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main

          before="$(git rev-parse HEAD)"
          git merge --no-edit upstream/main
          after="$(git rev-parse HEAD)"

          if [ "$before" = "$after" ]; then
            echo "Already up to date."
          else
            git push origin HEAD:main
            # A push made with GITHUB_TOKEN does not start another workflow.
            # Dispatch the production workflow explicitly after syncing.
            gh workflow run deploy-worker.yml --ref main
            echo "Synced upstream updates to main."
          fi
